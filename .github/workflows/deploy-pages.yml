# Publishes the Vite `dist/` folder to GitHub Pages (official Actions flow).
#
# One-time setup:
# 1. Repo → Settings → Pages → Build and deployment
# 2. Source: GitHub Actions (not “Deploy from a branch”)
# 3. After the first green run, open the site at:
#    https://<user>.github.io/<repo>/
#    (repo name is case-sensitive, e.g. …/VOR-Simulation/)

name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
